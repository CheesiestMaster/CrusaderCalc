[package]
name = "crusadercalc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
toml = "0.5"
serde = { version = "1.0", features = ["derive"] }

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
enumflags2 = "0.7"
base64 = "0.21"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "Node",
  "EventTarget",
  "Event",
  "InputEvent",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlOptionElement",
  "HtmlImageElement",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlHrElement",
  "HtmlParagraphElement",
  "FormData",
  "Storage",
  "console",
  "Location",
  "UrlSearchParams",
  "CssStyleDeclaration"
]

[profile.release]
opt-level = "s"
lto = true

[profile.dev.build-override]
debug = true

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true